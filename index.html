<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>nhà máy xi măng an giang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        // Tự động dò tìm file ảnh ở mọi định dạng hoặc tự lấy ảnh trong repo GitHub
        const photoCandidates = [
            'image_e4eb6c.png',
            'image_e4eb6c.jpg',
            'image_e4eb6c.jpeg',
            'image_e4eb6c.PNG',
            'image_e4eb6c.JPG',
            'image_e4eb6c.png.jpg',
            'image_e4eb6c.png.png',
            'image_e4eb6c.webp',
            'anh.jpg',
            'anh.png',
            'photo.jpg',
            'photo.png'
        ];
        let photoCandidateIndex = 1;
        let githubApiChecked = false;

        async function tryDiscoverGitHubImage(imgEl) {
            githubApiChecked = true;
            try {
                const host = window.location.hostname;
                if (host.endsWith('.github.io')) {
                    const owner = host.replace('.github.io', '');
                    const pathParts = window.location.pathname.split('/').filter(Boolean);
                    const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;
                    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
                    if (res.ok) {
                        const files = await res.json();
                        const imgFile = files.find(f =>
                            f.type === 'file' && /\.(png|jpe?g|webp|gif)$/i.test(f.name)
                        );
                        if (imgFile && imgFile.download_url) {
                            imgEl.src = imgFile.download_url;
                            return true;
                        }
                    }
                }
            } catch (e) {
                console.warn('GitHub auto image discovery skipped:', e);
            }
            return false;
        }

        async function handleCandidPhotoError() {
            const imgEl = document.getElementById('friend-photo');
            if (!imgEl) return;
            if (photoCandidateIndex < photoCandidates.length) {
                imgEl.src = photoCandidates[photoCandidateIndex++];
                return;
            }
            if (!githubApiChecked) {
                const found = await tryDiscoverGitHubImage(imgEl);
                if (found) return;
            }
            renderFallbackCandidPhoto();
        }

        // Hàm dự phòng hiển thị ảnh dìm nếu chưa có file ảnh nào trên server
        function renderFallbackCandidPhoto() {
            const imgEl = document.getElementById('friend-photo');
            if (!imgEl || imgEl.dataset.fallbackApplied) return;
            imgEl.dataset.fallbackApplied = 'true';

            const c = document.createElement('canvas');
            c.width = 480;
            c.height = 520;
            const g = c.getContext('2d');

            const bgGrad = g.createLinearGradient(0, 0, 480, 520);
            bgGrad.addColorStop(0, '#991b1b');
            bgGrad.addColorStop(0.45, '#1e293b');
            bgGrad.addColorStop(1, '#0f172a');
            g.fillStyle = bgGrad;
            g.fillRect(0, 0, 480, 520);

            g.fillStyle = 'rgba(251, 191, 36, 0.25)';
            for (let x = 20; x < 480; x += 65) {
                for (let y = 18; y < 145; y += 50) {
                    g.beginPath();
                    g.arc(x, y, 16, 0, Math.PI * 2);
                    g.fill();
                }
            }

            g.fillStyle = '#ffffff'; g.fillRect(14, 155, 68, 22);
            g.fillStyle = '#1d4ed8'; g.fillRect(14, 177, 68, 22);
            g.fillStyle = '#dc2626'; g.fillRect(14, 199, 68, 22);

            g.save();
            g.filter = 'blur(3.5px)';
            for (let pass = -2; pass <= 2; pass++) {
                g.globalAlpha = pass === 0 ? 0.92 : 0.22;
                const ox = pass * 6;

                g.fillStyle = '#18181b';
                g.beginPath();
                g.ellipse(175 + ox, 255, 76, 130, -0.12, 0, Math.PI * 2);
                g.fill();

                g.fillStyle = '#d6a582';
                g.beginPath();
                g.ellipse(165 + ox, 212, 46, 58, -0.15, 0, Math.PI * 2);
                g.fill();

                g.fillStyle = '#09090b';
                g.beginPath();
                g.arc(162 + ox, 185, 48, Math.PI, Math.PI * 2.05);
                g.fill();

                g.strokeStyle = '#3f2314';
                g.lineWidth = 3;
                g.beginPath();
                g.moveTo(140 + ox, 206); g.quadraticCurveTo(148 + ox, 210, 156 + ox, 206);
                g.moveTo(170 + ox, 204); g.quadraticCurveTo(178 + ox, 208, 186 + ox, 204);
                g.stroke();

                g.fillStyle = '#cbd5e1';
                g.beginPath();
                g.ellipse(265 + ox, 395, 115, 145, -0.25, 0, Math.PI * 2);
                g.fill();

                g.strokeStyle = '#334155';
                g.lineWidth = 4;
                for (let s = -90; s <= 90; s += 22) {
                    g.beginPath();
                    g.moveTo(180 + ox, 360 + s);
                    g.lineTo(350 + ox, 410 + s);
                    g.stroke();
                }

                g.fillStyle = '#c89674';
                g.beginPath();
                g.ellipse(295 + ox, 410, 32, 95, -0.15, 0, Math.PI * 2);
                g.fill();
            }
            g.restore();

            imgEl.src = c.toDataURL('image/jpeg', 0.9);
        }
    </script>

<body>

    <script>
        /* =========================================================================
           1. ÂM NHẠC STUDIO VIP (HỢP ÂM PIANO ĐIỆN + CHUÔNG PHA LÊ LẤP LÁNH)
           ========================================================================= */
        let audioCtx = null;
        let bgMusicPlaying = false;

        function startVipMusic() {
            if (bgMusicPlaying) return;
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                bgMusicPlaying = true;
                scheduleSongLoop();
            } catch (e) {
                console.warn('Web Audio skipped:', e);
            }
        }

        function triggerSynthVoice(freq, startTime, duration, vol = 0.12, type = 'triangle') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const sub = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);

            sub.type = 'sine';
            sub.frequency.setValueAtTime(freq * 2, startTime);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2600, startTime);

            const subGain = audioCtx.createGain();
            subGain.gain.setValueAtTime(0.24, startTime);

            gain.gain.setValueAtTime(0.0008, startTime);
            gain.gain.exponentialRampToValueAtTime(vol, startTime + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0004, startTime + duration);

            osc.connect(filter);
            sub.connect(subGain);
            subGain.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(startTime);
            sub.start(startTime);
            osc.stop(startTime + duration + 0.06);
            sub.stop(startTime + duration + 0.06);
        }

        function scheduleSongLoop() {
            if (!bgMusicPlaying || !audioCtx) return;

            const melody = [
                { f: 261.63, d: 0.36, chord: [174.61, 220.00] },
                { f: 261.63, d: 0.26 },
                { f: 293.66, d: 0.62, chord: [130.81, 196.00, 261.63] },
                { f: 261.63, d: 0.62 },
                { f: 349.23, d: 0.62, chord: [174.61, 220.00, 261.63] },
                { f: 329.63, d: 1.15, chord: [130.81, 196.00, 246.94] },

                { f: 261.63, d: 0.36 },
                { f: 261.63, d: 0.26 },
                { f: 293.66, d: 0.62, chord: [130.81, 196.00, 261.63] },
                { f: 261.63, d: 0.62 },
                { f: 392.00, d: 0.62, chord: [196.00, 246.94, 293.66] },
                { f: 349.23, d: 1.15, chord: [174.61, 220.00, 261.63] },

                { f: 261.63, d: 0.36 },
                { f: 261.63, d: 0.26 },
                { f: 523.25, d: 0.62, chord: [174.61, 220.00, 261.63] },
                { f: 440.00, d: 0.62 },
                { f: 349.23, d: 0.62, chord: [146.83, 174.61, 220.00] },
                { f: 329.63, d: 0.62 },
                { f: 293.66, d: 1.05, chord: [116.54, 174.61, 233.08] },

                { f: 466.16, d: 0.36 },
                { f: 466.16, d: 0.26 },
                { f: 440.00, d: 0.62, chord: [174.61, 220.00, 261.63] },
                { f: 349.23, d: 0.62 },
                { f: 392.00, d: 0.62, chord: [130.81, 196.00, 261.63] },
                { f: 349.23, d: 1.35, chord: [174.61, 220.00, 261.63, 349.23] }
            ];

            let t = audioCtx.currentTime + 0.08;
            let elapsed = 0;

            melody.forEach(item => {
                triggerSynthVoice(item.f, t, item.d * 0.96, 0.13, 'triangle');
                if (item.chord) {
                    item.chord.forEach(cf => {
                        triggerSynthVoice(cf, t, item.d * 1.9, 0.045, 'sine');
                    });
                }
                const step = item.d * 0.94;
                t += step;
                elapsed += step;
            });

            setTimeout(() => {
                if (bgMusicPlaying) scheduleSongLoop();
            }, (elapsed + 0.7) * 1000);
        }

        function playMagicFanfare() {
            if (!audioCtx) return;
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
            notes.forEach((f, i) => {
                triggerSynthVoice(f, audioCtx.currentTime + i * 0.07, 0.95, 0.13, 'sine');
            });
        }

        /* =========================================================================
           2. THẾ GIỚI ĐIỆN ẢNH 3D CHUẨN STUDIO (GALAXY + CAKE + GIFT + CROWN + VFX)
           ========================================================================= */
        let scene, camera, renderer, composer, bloomPass;
        let cakeGroup, giftGroup, giftLidGroup, card3DGroup, cardFrontCoverGroup, crownGroup, lightBeamMesh, haloRingsGroup;
        let candleFlames = [];
        let candleLights = [];
        let cakeFairyLights = [];
        let smokeParticles3D = [];
        let windParticles3D = [];
        let fireworkParticles3D = [];
        let fireworkTrails3D = [];
        let cardOrbitSparks = [];
        let stageSpotBeams = [];
        let confetti3D = [];
        let floatingBalloons = [];
        let galaxyGroup, goldDustPoints;
        let pbrTextures = {};

        // Điều khiển góc máy quay điện ảnh & xoay tay
        let targetCamPos = new THREE.Vector3(0, 4.8, 12.2);

        // Tạo bộ vân bề mặt vật liệu thật (PBR Bump/Roughness/Diffuse Maps)
        function createRealisticTextures() {
            const creamC = document.createElement('canvas');
            creamC.width = 512; creamC.height = 512;
            const cg = creamC.getContext('2d');
            cg.fillStyle = '#808080';
            cg.fillRect(0, 0, 512, 512);
            for (let y = 0; y < 512; y += 6) {
                const wave = Math.sin(y * 0.09) * 14;
                cg.strokeStyle = y % 12 === 0 ? 'rgba(255,255,255,0.28)' : 'rgba(40,40,40,0.22)';
                cg.lineWidth = 3;
                cg.beginPath();
                for (let x = 0; x <= 512; x += 16) {
                    const yy = y + Math.sin((x + wave) * 0.04) * 2.5;
                    if (x === 0) cg.moveTo(x, yy); else cg.lineTo(x, yy);
                }
                cg.stroke();
            }
            const creamBump = new THREE.CanvasTexture(creamC);
            creamBump.wrapS = creamBump.wrapT = THREE.RepeatWrapping;
            creamBump.repeat.set(3, 1);

            const velvetC = document.createElement('canvas');
            velvetC.width = 256; velvetC.height = 256;
            const vg = velvetC.getContext('2d');
            vg.fillStyle = '#808080';
            vg.fillRect(0, 0, 256, 256);
            for (let i = 0; i < 4500; i++) {
                const vx = Math.random() * 256;
                const vy = Math.random() * 256;
                vg.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.22)' : 'rgba(20,20,20,0.25)';
                vg.fillRect(vx, vy, 1.5, 3);
            }
            const velvetBump = new THREE.CanvasTexture(velvetC);
            velvetBump.wrapS = velvetBump.wrapT = THREE.RepeatWrapping;
            velvetBump.repeat.set(4, 4);

            const silkC = document.createElement('canvas');
            silkC.width = 128; silkC.height = 128;
            const sg = silkC.getContext('2d');
            sg.fillStyle = '#808080';
            sg.fillRect(0, 0, 128, 128);
            sg.strokeStyle = 'rgba(255,255,255,0.25)';
            sg.lineWidth = 1;
            for (let i = 0; i < 128; i += 3) {
                sg.beginPath(); sg.moveTo(0, i); sg.lineTo(128, i); sg.stroke();
            }
            const silkBump = new THREE.CanvasTexture(silkC);
            silkBump.wrapS = silkBump.wrapT = THREE.RepeatWrapping;
            silkBump.repeat.set(6, 6);

            const strawC = document.createElement('canvas');
            strawC.width = 256; strawC.height = 256;
            const stg = strawC.getContext('2d');
            const sGrad = stg.createLinearGradient(0, 0, 0, 256);
            sGrad.addColorStop(0, '#991b1b');
            sGrad.addColorStop(0.55, '#dc2626');
            sGrad.addColorStop(1, '#ef4444');
            stg.fillStyle = sGrad;
            stg.fillRect(0, 0, 256, 256);
            for (let row = 0; row < 12; row++) {
                for (let col = 0; col < 14; col++) {
                    const sx = col * 19 + (row % 2) * 9;
                    const sy = row * 21 + 8;
                    stg.fillStyle = '#7f1d1d';
                    stg.beginPath(); stg.ellipse(sx, sy + 1, 2.6, 3.6, 0, 0, Math.PI * 2); stg.fill();
                    stg.fillStyle = '#fde047';
                    stg.beginPath(); stg.ellipse(sx, sy, 1.5, 2.3, 0, 0, Math.PI * 2); stg.fill();
                }
            }
            const strawMap = new THREE.CanvasTexture(strawC);

            pbrTextures = { creamBump, velvetBump, silkBump, strawMap };
        }

        function buildStudioEnvironmentMap() {
            const envScene = new THREE.Scene();
            envScene.background = new THREE.Color(0x0b0518);

            const addPanel = (color, intensity, w, h, x, y, z, rx, ry) => {
                const mat = new THREE.MeshBasicMaterial({
                    color: new THREE.Color(color).multiplyScalar(intensity),
                    side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
                mesh.position.set(x, y, z);
                mesh.rotation.set(rx, ry, 0);
                envScene.add(mesh);
            };

            addPanel(0xfff1d6, 1.45, 16, 10, 0, 14, 6, Math.PI / 2.4, 0);
            addPanel(0xfbcfe8, 1.15, 12, 14, -14, 7, 8, 0, Math.PI / 3);
            addPanel(0xbae6fd, 1.1, 12, 14, 14, 7, 8, 0, -Math.PI / 3);
            addPanel(0xfde68a, 1.25, 14, 8, 0, 6, -14, 0, 0);

            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();
            const envRT = pmremGenerator.fromScene(envScene, 0.04);
            scene.environment = envRT.texture;
            pmremGenerator.dispose();
        }

        function init3DWorld() {

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

                composer = new THREE.EffectComposer(renderer);
                const renderPass = new THREE.RenderPass(scene, camera);

                bloomPass = new THREE.UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),

        function createPipedCreamSwirl(material, scale = 1.0) {
            const swirlGroup = new THREE.Group();
            const points = [];
            for (let i = 0; i <= 24; i++) {
                const t = i / 24;
                const r = (1 - Math.pow(t, 1.25)) * 0.145 * scale;
                const y = t * 0.24 * scale;
                points.push(new THREE.Vector2(r, y));
            }
            const latheGeo = new THREE.LatheGeometry(points, 36);
            const posAttr = latheGeo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i);
                const vy = posAttr.getY(i);
                const vz = posAttr.getZ(i);
                const angle = Math.atan2(vz, vx);
                const twist = vy * 24;
                const flute = 1 + 0.18 * Math.sin(angle * 10 + twist);
                posAttr.setXYZ(i, vx * flute, vy, vz * flute);
            }
            latheGeo.computeVertexNormals();
            const mesh = new THREE.Mesh(latheGeo, material);
            mesh.castShadow = true;
            swirlGroup.add(mesh);
            return swirlGroup;
        }

        function createFlutedCreamShell(material, scale = 1.0) {
            const geo = new THREE.SphereGeometry(0.11 * scale, 20, 14);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const vz = pos.getZ(i);
                const angle = Math.atan2(vy, vx);
                const ridge = 1 + 0.14 * Math.cos(angle * 8);
                pos.setXYZ(i, vx * ridge, vy * 0.82 * ridge, vz * 1.45);
            }
            geo.computeVertexNormals();
            const shell = new THREE.Mesh(geo, material);
            shell.castShadow = true;
            return shell;
        }

        function createButtercreamRose3D(petalMat, scale = 1.0) {
            const roseGroup = new THREE.Group();

            const leafMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.42 });
            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.quadraticCurveTo(0.07, 0.04, 0.14, 0);
            leafShape.quadraticCurveTo(0.07, -0.04, 0, 0);
            const leafGeo = new THREE.ShapeGeometry(leafShape);

            for (let l = 0; l < 3; l++) {
                const leaf = new THREE.Mesh(leafGeo, leafMat);
                const la = (l / 3) * Math.PI * 2 + 0.3;
                leaf.position.set(Math.cos(la) * 0.12 * scale, 0.015, Math.sin(la) * 0.12 * scale);
                leaf.rotation.set(-Math.PI / 2.2, 0, la);
                leaf.scale.setScalar(scale * 1.2);
                roseGroup.add(leaf);
            }

            const budGeo = new THREE.CylinderGeometry(0.025 * scale, 0.045 * scale, 0.12 * scale, 16);
            const bud = new THREE.Mesh(budGeo, petalMat);
            bud.position.y = 0.075 * scale;
            roseGroup.add(bud);

            const petalShape = new THREE.Shape();
            petalShape.moveTo(0, 0);
            petalShape.bezierCurveTo(-0.075, 0.03, -0.085, 0.12, 0, 0.135);
            petalShape.bezierCurveTo(0.085, 0.12, 0.075, 0.03, 0, 0);

            const petalGeo = new THREE.ExtrudeGeometry(petalShape, {
                depth: 0.008,
                bevelEnabled: true,
                bevelSegments: 2,
                steps: 1,
                bevelSize: 0.004,
                bevelThickness: 0.004
            });
            const pPos = petalGeo.attributes.position;
            for (let i = 0; i < pPos.count; i++) {
                const px = pPos.getX(i);
                const py = pPos.getY(i);
                const pz = pPos.getZ(i);
                const safeY = Math.max(0, py);
                const cupZ = pz - (px * px) * 2.8 + Math.pow(safeY, 2.2) * 3.5;
                pPos.setZ(i, cupZ);
            }
            petalGeo.computeVertexNormals();

            const layers = [
                { count: 4, r: 0.042, tilt: 0.25, h: 0.035, s: 0.72 },
                { count: 6, r: 0.076, tilt: 0.55, h: 0.025, s: 0.95 },
                { count: 8, r: 0.115, tilt: 0.92, h: 0.015, s: 1.15 }
            ];

            layers.forEach((layer, lIdx) => {
                for (let p = 0; p < layer.count; p++) {
                    const angle = (p / layer.count) * Math.PI * 2 + lIdx * 0.55;
                    const petal = new THREE.Mesh(petalGeo, petalMat);
                    petal.scale.setScalar(scale * layer.s);
                    petal.position.set(
                        Math.cos(angle) * layer.r * scale,
                        layer.h * scale,
                        Math.sin(angle) * layer.r * scale
                    );
                    petal.rotation.y = -angle + Math.PI / 2;
                    petal.rotation.x = layer.tilt;
                    petal.castShadow = true;
                    roseGroup.add(petal);
                }
            });

            return roseGroup;
        }

        function createOrganicStrawberry3D(strawMat, leafMat, scale = 1.0) {
            const berryGroup = new THREE.Group();

        function attachWickAndFlame(parentGroup, x, y) {
            const wick = new THREE.Mesh(
                new THREE.CylinderGeometry(0.011, 0.014, 0.11, 10),
                new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.9 })
            );
            wick.position.set(x, y + 0.04, 0);
            parentGroup.add(wick);

            const flameGroup = new THREE.Group();
            flameGroup.position.set(x, y + 0.08, 0);

            const buildTeardropFlame = (rx, height) => {
                const pts = [];
                for (let i = 0; i <= 20; i++) {
                    const t = i / 20;
                    const r = Math.sin(t * Math.PI) * Math.pow(1 - t, 0.58) * rx;
                    pts.push(new THREE.Vector2(r, t * height));
                }
                return new THREE.LatheGeometry(pts, 20);
            };

            const blueBase = new THREE.Mesh(
                new THREE.SphereGeometry(0.036, 14, 14),
                new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.85 })
            );
            blueBase.scale.set(0.95, 1.3, 0.95);
            blueBase.position.y = 0.025;
            flameGroup.add(blueBase);

            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const coreMesh = new THREE.Mesh(buildTeardropFlame(0.038, 0.17), coreMat);
            coreMesh.position.y = 0.025;
            flameGroup.add(coreMesh);

            const midMat = new THREE.MeshBasicMaterial({
                color: 0xfbbf24,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const midMesh = new THREE.Mesh(buildTeardropFlame(0.068, 0.25), midMat);
            midMesh.position.y = 0.015;
            flameGroup.add(midMesh);

            const outerMat = new THREE.MeshBasicMaterial({
                color: 0xf97316,
                transparent: true,
                opacity: 0.42,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const outerMesh = new THREE.Mesh(buildTeardropFlame(0.11, 0.32), outerMat);
            flameGroup.add(outerMesh);

            parentGroup.add(flameGroup);
            candleFlames.push(flameGroup);

            const ptLight = new THREE.PointLight(0xffb74d, 1.55, 6.5);
            ptLight.position.set(x, y + 0.34, 0.16);
            parentGroup.add(ptLight);
            candleLights.push(ptLight);
        }

        function createLuxuryGiftBow3D(baseRibbonMat) {
            const bowGroup = new THREE.Group();

            const silkGoldMat = baseRibbonMat.clone();
            silkGoldMat.color.setHex(0xfbbf24);
            silkGoldMat.emissive = new THREE.Color(0x92400e);
            silkGoldMat.emissiveIntensity = 0.14;

            const champagneSilkMat = baseRibbonMat.clone();
            champagneSilkMat.color.setHex(0xfef08a);
            champagneSilkMat.emissive = new THREE.Color(0xb45309);
            champagneSilkMat.emissiveIntensity = 0.18;

            const goldSettingMat = new THREE.MeshStandardMaterial({
                color: 0xfacc15,
                metalness: 0.96,
                roughness: 0.1
            });

            const buildPetalGeometry = (length, width, thickness) => {
                const shape = new THREE.Shape();
                shape.moveTo(0, 0);
                shape.bezierCurveTo(length * 0.35, width * 0.58, length * 0.96, width * 0.48, length, 0);
                shape.bezierCurveTo(length * 0.96, -width * 0.48, length * 0.35, -width * 0.58, 0, 0);

                const geo = new THREE.ExtrudeGeometry(shape, {
                    depth: thickness,
                    bevelEnabled: true,
                    bevelSegments: 5,
                    steps: 2,
                    bevelSize: 0.02,
                    bevelThickness: 0.02
                });
                geo.translate(0, 0, -thickness / 2);

                const pos = geo.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const px = pos.getX(i);
                    const py = pos.getY(i);
                    const pz = pos.getZ(i);
                    const t = Math.min(1, Math.max(0, px / length));
                    const archY = Math.sin(t * Math.PI) * 0.16;
                    const pinch = 0.32 + 0.68 * Math.sin(t * Math.PI * 0.85);
                    const pleat = Math.cos((py / (width * 0.5)) * Math.PI * 2) * 0.012 * t;
                    pos.setXYZ(i, px, py * pinch, pz + archY + pleat);
                }
                geo.computeVertexNormals();
                return geo;
            };

            const tier1Geo = buildPetalGeometry(0.86, 0.44, 0.06);
            const tier2Geo = buildPetalGeometry(0.68, 0.36, 0.055);
            const tier3Geo = buildPetalGeometry(0.50, 0.28, 0.05);
            const tier4Geo = buildPetalGeometry(0.34, 0.20, 0.045);

            [0.36, Math.PI - 0.36, Math.PI + 0.36, -0.36].forEach((angle, idx) => {
                const p = new THREE.Mesh(tier1Geo, idx % 2 === 0 ? silkGoldMat : champagneSilkMat);
                p.position.y = 0.05;
                p.rotation.set(-Math.PI / 2 + 0.16, 0, 0);
                const holder = new THREE.Group();
                holder.rotation.y = angle;
                holder.add(p);
                p.castShadow = true;
                bowGroup.add(holder);
            });

            [0, Math.PI / 2, Math.PI, -Math.PI / 2].forEach((angle, idx) => {
                const p = new THREE.Mesh(tier2Geo, idx % 2 === 0 ? champagneSilkMat : silkGoldMat);
                p.position.y = 0.11;
                p.rotation.set(-Math.PI / 2 + 0.42, 0, 0);
                const holder = new THREE.Group();
                holder.rotation.y = angle;
                holder.add(p);
                p.castShadow = true;
                bowGroup.add(holder);
            });

            [Math.PI / 4, (3 * Math.PI) / 4, (5 * Math.PI) / 4, (7 * Math.PI) / 4].forEach(angle => {
                const p = new THREE.Mesh(tier3Geo, silkGoldMat);
                p.position.y = 0.16;
                p.rotation.set(-Math.PI / 2 + 0.68, 0, 0);
                const holder = new THREE.Group();
                holder.rotation.y = angle;
                holder.add(p);
                p.castShadow = true;
                bowGroup.add(holder);
            });

            [0, Math.PI].forEach(angle => {
                const p = new THREE.Mesh(tier4Geo, champagneSilkMat);
                p.position.y = 0.21;
                p.rotation.set(-Math.PI / 2 + 0.92, 0, 0);
                const holder = new THREE.Group();
                holder.rotation.y = angle;
                holder.add(p);
                bowGroup.add(holder);
            });

            [-0.08, 0, 0.08].forEach((ox, idx) => {
                const band = new THREE.Mesh(
                    new THREE.TorusGeometry(0.16 - Math.abs(ox) * 0.15, 0.048, 16, 36),
                    idx === 1 ? champagneSilkMat : silkGoldMat
                );
                band.position.set(ox, 0.15, 0);
                band.rotation.y = Math.PI / 2;
                band.scale.set(1.15, 1.35, 1);
                bowGroup.add(band);
            });

            const bezelRing = new THREE.Mesh(new THREE.TorusGeometry(0.115, 0.018, 14, 36), goldSettingMat);
            bezelRing.rotation.x = Math.PI / 2;
            bezelRing.position.y = 0.285;
            bowGroup.add(bezelRing);

            const rubyMat = new THREE.MeshPhysicalMaterial({
                color: 0xf43f5e,
                emissive: 0xbe123c,
                emissiveIntensity: 0.35,
                metalness: 0.1,
                roughness: 0.04,
                clearcoat: 1.0,
                clearcoatRoughness: 0.02
            });
            const rubyGem = new THREE.Mesh(new THREE.OctahedronGeometry(0.095, 2), rubyMat);
            rubyGem.position.y = 0.295;
            rubyGem.scale.set(1, 0.65, 1);
            bowGroup.add(rubyGem);

            const diamondMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff,
                emissive: 0xe0f2fe,
                emissiveIntensity: 0.45,
                roughness: 0.02,
                metalness: 0.2,
                clearcoat: 1.0
            });
            for (let d = 0; d < 12; d++) {
                const da = (d / 12) * Math.PI * 2;
                const diamond = new THREE.Mesh(new THREE.OctahedronGeometry(0.022, 0), diamondMat);
                diamond.position.set(Math.cos(da) * 0.115, 0.295, Math.sin(da) * 0.115);
                bowGroup.add(diamond);
            }

            [-1, 1].forEach(side => {
                const tailShape = new THREE.Shape();
                tailShape.moveTo(0, -0.09);
                tailShape.quadraticCurveTo(0.45, -0.14, 0.98, -0.17);
                tailShape.lineTo(0.84, 0);
                tailShape.lineTo(0.98, 0.17);
                tailShape.quadraticCurveTo(0.45, 0.14, 0, 0.09);
                tailShape.closePath();

                const tailGeo = new THREE.ExtrudeGeometry(tailShape, {
                    depth: 0.018,
                    bevelEnabled: true,
                    bevelSegments: 2,
                    steps: 1,
                    bevelSize: 0.006,
                    bevelThickness: 0.006
                });
                const tPos = tailGeo.attributes.position;
                for (let i = 0; i < tPos.count; i++) {
                    const tx = tPos.getX(i);
                    const tz = tPos.getZ(i);
                    const waveZ = Math.sin(tx * 4.5) * 0.032 - tx * 0.025;
                    tPos.setZ(i, tz + waveZ);
                }
                tailGeo.computeVertexNormals();

                const tailMesh = new THREE.Mesh(tailGeo, side === -1 ? silkGoldMat : champagneSilkMat);
                tailMesh.position.set(side * 0.08, 0.032, 0.14);
                tailMesh.rotation.set(-Math.PI / 2, 0, side === -1 ? -Math.PI * 0.62 : -Math.PI * 0.38);
                tailMesh.castShadow = true;
                bowGroup.add(tailMesh);
            });

            return bowGroup;
        }

        function launchFirework3D(originPos) {
            const colors = [0xff4d94, 0xfacc15, 0x38bdf8, 0xc084fc, 0x4ade80, 0xfb923c];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = 88;
            const geo = new THREE.SphereGeometry(0.056, 8, 8);
            const trailGeo = new THREE.CylinderGeometry(0.008, 0.025, 0.55, 6);
            trailGeo.rotateX(Math.PI / 2);

            for (let i = 0; i < count; i++) {
                const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
                const spark = new THREE.Mesh(geo, mat);
                spark.position.copy(originPos);

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const speed = 0.075 + Math.random() * 0.135;

                const vx = Math.sin(phi) * Math.cos(theta) * speed;
                const vy = Math.cos(phi) * speed + 0.035;
                const vz = Math.sin(phi) * Math.sin(theta) * speed;

                scene.add(spark);
                fireworkParticles3D.push({
                    mesh: spark,
                    vx, vy, vz,
                    life: 1.0,
                    twinklePhase: Math.random() * Math.PI * 2
                });

                if (i % 3 === 0) {
                    const tMat = new THREE.MeshBasicMaterial({
                        color,
                        transparent: true,
                        opacity: 0.65,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                    const trail = new THREE.Mesh(trailGeo, tMat);
                    trail.position.copy(originPos);
                    trail.lookAt(originPos.x + vx, originPos.y + vy, originPos.z + vz);
                    scene.add(trail);
                    fireworkTrails3D.push({
                        mesh: trail,
                        vx, vy, vz,
                        life: 0.85
                    });
                }
            }
        }

        async function initMicrophoneBlow() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                const micCtx = new AudioContextClass();
                const source = micCtx.createMediaStreamSource(micStream);
                micAnalyser = micCtx.createAnalyser();
                micAnalyser.fftSize = 256;
                source.connect(micAnalyser);
                micDataArray = new Uint8Array(micAnalyser.frequencyBinCount);
            } catch (e) {
            }
        }

        function startHoldBlow(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (!candlesExtinguished) isHoldingBlow = true;
        }

        function stopHoldBlow() {
            isHoldingBlow = false;
        }

        function updateBlowLogic() {
            if (currentStage !== 'cake' || candlesExtinguished) return;

            let micBlowDetected = false;
            if (micAnalyser && micDataArray && performance.now() - cakeSceneEnteredAt > 800) {
                micAnalyser.getByteFrequencyData(micDataArray);
                let sum = 0;
                for (let i = 2; i < 32; i++) sum += micDataArray[i];
                const avg = sum / 30;
                if (avg > 82) micBlowDetected = true;
            }

            const isBlowing = isHoldingBlow || micBlowDetected;

            if (isBlowing) {
                blowProgress = Math.min(100, blowProgress + 2.6);
                candleFlames.forEach(f => {
                    f.rotation.x = -0.58 + (Math.random() - 0.5) * 0.25;
                    f.scale.setScalar(Math.max(0.28, 1 - blowProgress / 120));
                });
                if (Math.random() > 0.35) spawnWindStream3D();
            } else {
                blowProgress = Math.max(0, blowProgress - 0.8);
                candleFlames.forEach(f => {
                    f.rotation.x *= 0.85;
                    f.scale.setScalar(1);
                });
            }

            const meter = document.getElementById('blow-meter');
            if (meter) meter.style.width = `${blowProgress}%`;

            if (blowProgress >= 100) {
                extinguishCandles3D();
            }
        }

        function extinguishCandles3D() {
            candlesExtinguished = true;
            isHoldingBlow = false;
            if (micStream) micStream.getTracks().forEach(t => t.stop());

            candleFlames.forEach(f => {
                const wp = new THREE.Vector3();
                f.getWorldPosition(wp);
                spawn3DSmoke(wp);
                f.visible = false;
            });
            candleLights.forEach(l => l.intensity = 0);

            playMagicFanfare();
            spawnConfettiRain3D(130);
            launchFirework3D(new THREE.Vector3(-2.3, 4.4, -1.5));
            setTimeout(() => launchFirework3D(new THREE.Vector3(2.3, 4.7, -1.2)), 260);
            setTimeout(() => launchFirework3D(new THREE.Vector3(0, 5.2, -2.0)), 520);

            setTimeout(() => {
                transitionToGiftBox3D();
            }, 2300);
        }

        function transitionToGiftBox3D() {
            currentStage = 'gift';
            cakeShrinkingOut = true;
            giftGroup.visible = true;
            giftGroup.scale.set(0.01, 0.01, 0.01);

            orbitYaw = 0;
            orbitPitch = 0;
            targetCamPos.set(0, 4.4, 7.8);
            targetLookAt.set(0, 1.5, 0);
            setActiveHud('hud-gift');
        }

        function initRibbonDrag() {
            const track = document.getElementById('ribbon-track');
            const knob = document.getElementById('ribbon-knob');
            let dragging = false;
            let startX = 0;
            let currentX = 0;

            const getMaxDrag = () => track.clientWidth - knob.clientWidth - 10;

            const onStart = (e) => {
                if (giftLidOpening) return;
                dragging = true;
                startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
            };

            const onMove = (e) => {
                if (!dragging || giftLidOpening) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const max = getMaxDrag();
                currentX = Math.max(0, Math.min(max, clientX - startX));
                knob.style.transform = `translateX(${currentX}px)`;

                if (currentX >= max * 0.82) {
                    dragging = false;
                    knob.style.transform = `translateX(${max}px)`;
                    openGiftBoxLid3D();
                }
            };

            const onEnd = () => {
                if (!dragging || giftLidOpening) return;
                dragging = false;
                if (currentX < getMaxDrag() * 0.82) {
                    currentX = 0;
                    knob.style.transition = 'transform 0.3s ease';
                    knob.style.transform = 'translateX(0px)';
                    setTimeout(() => knob.style.transition = '', 300);
                }
            };

            knob.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            knob.addEventListener('touchstart', onStart, { passive: true });
            window.addEventListener('touchmove', onMove, { passive: true });
            window.addEventListener('touchend', onEnd);

            knob.addEventListener('click', () => {
                if (!giftLidOpening) {
                    knob.style.transition = 'transform 0.35s ease';
                    knob.style.transform = `translateX(${getMaxDrag()}px)`;
                    openGiftBoxLid3D();
                }
            });
        }

        function openGiftBoxLid3D() {
            if (giftLidOpening) return;
            giftLidOpening = true;
            playMagicFanfare();
            launchFirework3D(new THREE.Vector3(0, 4.3, 0));

            orbitYaw = 0;
            orbitPitch = 0;
            targetCamPos.set(0, 3.3, 6.2);
            targetLookAt.set(0, 2.35, 0.5);

            setTimeout(() => {
                currentStage = 'card';
                setActiveHud('hud-card');
            }, 1900);
        }

        function showFinalGiftReveal() {
            currentStage = 'reveal';
            if (card3DGroup) card3DGroup.visible = false;
            cardOrbitSparks.forEach(s => { s.mesh.visible = false; });
            crownGroup.visible = true;
            crownGroup.scale.set(0.01, 0.01, 0.01);

            playMagicFanfare();
            spawnConfettiRain3D(150);
            launchFirework3D(new THREE.Vector3(-2.1, 4.6, -1));
            launchFirework3D(new THREE.Vector3(2.1, 4.6, -1));

            orbitYaw = 0;
            orbitPitch = 0;
            targetCamPos.set(0, 4.5, 7.6);
            targetLookAt.set(0, 2.0, 0);
            setActiveHud('hud-reveal');
        }

        function setupInteractions() {
            initRibbonDrag();
            const canvas = document.getElementById('world-3d');
            let downPos = { x: 0, y: 0 };

            const onDown = (x, y) => {
                isPointerDown = true;
                prevPointer = { x, y };
                downPos = { x, y };
            };
            const onMove = (x, y) => {
                if (!isPointerDown) return;
                const dx = x - prevPointer.x;
                const dy = y - prevPointer.y;
                orbitYaw -= dx * 0.007;
                orbitPitch = Math.max(-0.35, Math.min(0.45, orbitPitch + dy * 0.005));
                prevPointer = { x, y };
            };
            const onUp = (x, y) => {
                if (isPointerDown && currentStage !== 'intro') {
                    const dist = Math.hypot(x - downPos.x, y - downPos.y);
                    if (dist < 8) {
                        const nx = (x / window.innerWidth) * 2 - 1;
                        const ny = -(y / window.innerHeight) * 2 + 1;
                        launchFirework3D(new THREE.Vector3(nx * 3.8, 3.2 + ny * 2.0, -1.5));
                    }
                }
                isPointerDown = false;
            };

            canvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
            window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', e => {
                stopHoldBlow();
                onUp(e.clientX, e.clientY);
            });

            canvas.addEventListener('touchstart', e => {
                if (e.touches.length === 1) onDown(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchmove', e => {
                if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });
            window.addEventListener('touchend', e => {
                stopHoldBlow();
                const t = e.changedTouches && e.changedTouches[0];
                if (t) onUp(t.clientX, t.clientY);
                else isPointerDown = false;
            });
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (composer) composer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        function animate3D() {
            requestAnimationFrame(animate3D);
            const t = clock.getElapsedTime();

            updateBlowLogic();

            if (cakeShrinkingOut && cakeGroup && cakeGroup.visible) {
                cakeGroup.scale.lerp(new THREE.Vector3(0.001, 0.001, 0.001), 0.14);
                cakeGroup.rotation.y += 0.08;
                if (cakeGroup.scale.x < 0.03) {
                    cakeGroup.visible = false;
                    cakeShrinkingOut = false;
                }
            }

            if (giftGroup && giftGroup.visible) {
                giftGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            }

            if (cakeGroup && cakeGroup.visible && !cakeShrinkingOut) {
                cakeGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.09);
                if (!isPointerDown) cakeGroup.rotation.y = Math.sin(t * 0.45) * 0.22;
            }

            candleFlames.forEach((f, idx) => {
                if (!f.visible) return;
                const flicker = Math.sin(t * 21 + idx * 3.1) * 0.075 + Math.cos(t * 33 + idx) * 0.04;
                f.scale.set(1 + flicker * 0.6, 1 + flicker * 1.25, 1 + flicker * 0.6);
                f.rotation.z = Math.sin(t * 14 + idx * 1.7) * 0.07;
            });
            candleLights.forEach((l, idx) => {
                if (l.intensity > 0) {
                    l.intensity = 1.48 + Math.sin(t * 24 + idx) * 0.25;
                }
            });
            cakeFairyLights.forEach(led => {
                const pulse = 0.65 + 0.35 * Math.sin(t * 4.5 + led.phase);
                led.mesh.scale.setScalar(pulse);
            });

            if (giftLidOpening && giftLidAnimProgress < 1) {
                giftLidAnimProgress = Math.min(1, giftLidAnimProgress + 0.022);
                const ease = 1 - Math.pow(1 - giftLidAnimProgress, 3);
                giftLidGroup.rotation.x = -ease * 1.56;
                giftLidGroup.position.y = 1.78 + ease * 0.48;
                giftLidGroup.position.z = -1.32 - ease * 0.24;

                if (lightBeamMesh) {
                    lightBeamMesh.material.opacity = Math.sin(ease * Math.PI) * 0.24;
                    lightBeamMesh.rotation.y = t * 0.8;
                }
            }

            if (giftLidOpening && giftLidAnimProgress > 0.55 && card3DGroup && currentStage !== 'reveal') {
                card3DGroup.visible = true;
                card3DRevealProgress = Math.min(1, card3DRevealProgress + 0.011);
                const cEase = 1 - Math.pow(1 - card3DRevealProgress, 3);

                card3DGroup.position.y = 1.1 + cEase * 1.65 + Math.sin(t * 2.2) * 0.04 * cEase;
                card3DGroup.position.z = cEase * 1.55;
                card3DGroup.scale.setScalar(0.55 + cEase * 0.55);

                if (cardFrontCoverGroup && cEase > 0.32) {
                    const openProgress = Math.min(1, (cEase - 0.32) / 0.68);
                    const openEase = 1 - Math.pow(1 - openProgress, 3);
                    cardFrontCoverGroup.rotation.y = -openEase * (Math.PI * 0.86);
                    card3DGroup.position.x = -0.45 * openEase;
                }

                cardOrbitSparks.forEach(s => {
                    s.mesh.visible = true;
                    s.angle += s.speed * 0.016;
                    s.mesh.position.set(
                        Math.cos(s.angle) * s.radius,
                        card3DGroup.position.y + s.yOffset + Math.sin(t * 2.5 + s.phase) * 0.16,
                        card3DGroup.position.z + Math.sin(s.angle) * s.radius * 0.65
                    );
                    s.mesh.rotation.y += 0.05;
                    s.mesh.scale.setScalar(0.65 + 0.45 * Math.sin(t * 6 + s.phase));
                });
            }

            if (crownGroup && crownGroup.visible) {
                crownGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                crownGroup.rotation.y += 0.018;
                crownGroup.position.y = 2.4 + Math.sin(t * 2.5) * 0.12;
                if (haloRingsGroup) {
                    haloRingsGroup.rotation.z += 0.025;
                    haloRingsGroup.rotation.x += 0.015;
                }
            }

            if (galaxyGroup) galaxyGroup.rotation.y = t * 0.025;
            if (goldDustPoints) goldDustPoints.rotation.y = -t * 0.05;

            stageSpotBeams.forEach(b => {
                b.mesh.rotation.z = b.baseRotZ + Math.sin(t * 0.65 + b.phase) * 0.14;
            });

            floatingBalloons.forEach(b => {
                b.mesh.position.y = b.baseY + Math.sin(t * b.speed + b.phase) * 0.25;
                b.mesh.rotation.z = Math.sin(t * 0.8 + b.phase) * 0.08;
            });

            for (let i = windParticles3D.length - 1; i >= 0; i--) {
                const w = windParticles3D[i];
                w.mesh.position.z += w.vz;
                w.life -= 0.055;
                w.mesh.material.opacity = Math.max(0, w.life * 0.6);
                if (w.life <= 0) {
                    scene.remove(w.mesh);
                    windParticles3D.splice(i, 1);
                }
            }

            for (let i = smokeParticles3D.length - 1; i >= 0; i--) {
                const p = smokeParticles3D[i];
                p.mesh.position.x += p.vx;
                p.mesh.position.y += p.vy;
                p.mesh.position.z += p.vz;
                p.mesh.scale.addScalar(0.014);
                p.life -= 0.013;
                p.mesh.material.opacity = Math.max(0, p.life * 0.72);
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    smokeParticles3D.splice(i, 1);
                }
            }

            for (let i = fireworkParticles3D.length - 1; i >= 0; i--) {
                const fw = fireworkParticles3D[i];
                fw.mesh.position.x += fw.vx;
                fw.mesh.position.y += fw.vy;
                fw.mesh.position.z += fw.vz;
                fw.vy -= 0.0022;
                fw.vx *= 0.985;
                fw.vz *= 0.985;
                fw.life -= 0.015;
                const twinkle = 0.75 + 0.25 * Math.sin(t * 32 + fw.twinklePhase);
                fw.mesh.material.opacity = Math.max(0, fw.life * twinkle);
                if (fw.life <= 0) {
                    scene.remove(fw.mesh);
                    fireworkParticles3D.splice(i, 1);
                }
            }

            for (let i = fireworkTrails3D.length - 1; i >= 0; i--) {
                const tr = fireworkTrails3D[i];
                tr.mesh.position.x += tr.vx * 0.92;
                tr.mesh.position.y += tr.vy * 0.92;
                tr.mesh.position.z += tr.vz * 0.92;
                tr.vy -= 0.0022;
                tr.life -= 0.022;
                tr.mesh.material.opacity = Math.max(0, tr.life * 0.65);
                tr.mesh.scale.z = Math.max(0.1, tr.life);
                if (tr.life <= 0) {
                    scene.remove(tr.mesh);
                    fireworkTrails3D.splice(i, 1);
                }
            }

            for (let i = confetti3D.length - 1; i >= 0; i--) {
                const c = confetti3D[i];
                c.mesh.position.y += c.vy;
                c.mesh.position.x += c.vx + Math.sin(t * 3 + i) * 0.008;
                c.mesh.rotation.x += c.rx;
                c.mesh.rotation.y += c.ry;
                if (c.mesh.position.y < -0.2) {
                    c.mesh.position.y = 7.5 + Math.random() * 2.5;
                }
            }

            const radius = Math.hypot(targetCamPos.x, targetCamPos.z);
            const cinemaBreathX = Math.sin(t * 0.55) * 0.14;
            const cinemaBreathY = Math.cos(t * 0.72) * 0.08;
            const desiredCam = new THREE.Vector3(
                Math.sin(orbitYaw) * radius + cinemaBreathX,
                targetCamPos.y + orbitPitch * 4.5 + cinemaBreathY,
                Math.cos(orbitYaw) * radius
            );
            camera.position.lerp(desiredCam, 0.055);
            currentLookAt.lerp(targetLookAt, 0.065);
            camera.lookAt(currentLookAt);

            if (composer) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }

        window.onload = function () {
            init3DWorld();
        };
    </script>
</body>
</html>
